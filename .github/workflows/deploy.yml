name: Build, Verify & Deploy Meridian Academy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Typecheck, Build & Integration Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Run end-to-end integration test suite
        if: env.TEST_API_BASE_URL != ''
        env:
          TEST_API_BASE_URL: ${{ secrets.TEST_API_BASE_URL }}
        run: npm run test:e2e

  deploy:
    name: Build & Deploy Container to Cloud Run
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION || 'europe-west2' }}-docker.pkg.dev --quiet

      - name: Build and push container image
        env:
          IMAGE_URI: ${{ vars.GCP_REGION || 'europe-west2' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/meridian-academy/app:${{ github.sha }}
        run: |
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Deploy to Cloud Run
        env:
          IMAGE_URI: ${{ vars.GCP_REGION || 'europe-west2' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/meridian-academy/app:${{ github.sha }}
        run: |
          gcloud run deploy meridian-academy \
            --image "$IMAGE_URI" \
            --region "${{ vars.GCP_REGION || 'europe-west2' }}" \
            --platform managed \
            --port 3000 \
            --allow-unauthenticated
